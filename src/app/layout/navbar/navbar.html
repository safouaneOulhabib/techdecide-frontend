<header class="navbar">
  <div class="navbar-search">
    <i class="pi pi-search"></i>
    <input placeholder="Search anything..." />
    <span class="kbd">⌘K</span>
  </div>

  <div class="navbar-right">
    <button class="navbar-btn" title="Toggle dark mode" (click)="toggleDarkMode()">
      <i class="pi" [class.pi-sun]="isDark()" [class.pi-moon]="!isDark()"></i>
    </button>

    <button class="navbar-btn" title="Notifications">
      <i class="pi pi-bell"></i>
    </button>

    <div class="user-avatar" title="Logout" (click)="logout()">
      {{ userInitial() }}
    </div>
  </div>
</header>
