<div class="pdf-preview-page">

  <div class="preview-toolbar">
    <div class="toolbar-actions">
      <button class="btn-back" (click)="backToReport()">
        <i class="pi pi-arrow-left"></i>
        Back to report
      </button>

      <button class="btn-header-action btn-primary-action" [disabled]="!report() || downloadingPdf()" (click)="downloadPdf()">
        <i class="pi pi-download"></i>
        Download PDF
      </button>
    </div>

    <div class="toolbar-main">
      <div class="title-block">
        @if (report()) {
        <h1>{{ report()!.title }}</h1>
        } @else {
        <p-skeleton width="260px" height="28px" />
        }
      </div>
    </div>
  </div>

  @if (error()) {
  <p-message severity="error" [text]="error()!" />
  }

  @if (loading() && !report()) {
  <div class="preview-document loading-shell">
    <p-skeleton width="100%" height="90vh" />
  </div>
  }

  @if (pdfUrl()) {
  <div class="preview-document">
    <iframe
      class="pdf-frame"
      title="Report PDF preview"
      [src]="pdfUrl()"
    ></iframe>
  </div>
  }

</div>
