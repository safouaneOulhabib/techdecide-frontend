<div class="report-card" (click)="onView.emit(report().id)">
  <div class="card-body">
    <h3 class="card-title">{{ report().title }}</h3>
    <p class="card-meta">by {{ report().authorName }} &bull; {{ report().createdAt | date:'mediumDate' }}</p>
  </div>

  <div class="card-footer">
    <span class="item-count-badge">
      <i class="pi pi-file"></i>
      {{ report().itemCount }} decision{{ report().itemCount === 1 ? '' : 's' }}
    </span>

    @if (isOwner()) {
    <button class="btn-delete" (click)="onDeleteClick($event)">
      <i class="pi pi-trash"></i>
    </button>
    }
  </div>
</div>
