<div class="tag-list">
  <div class="page-header">
    <h2>Tags</h2>
    <div class="create-form">
      <input pInputText [(ngModel)]="newTagName" placeholder="Tag name" (keyup.enter)="onCreateTag()" />
      <p-colorpicker [(ngModel)]="newTagColor" />
      <p-button label="New Tag" icon="pi pi-plus" (onClick)="onCreateTag()" [disabled]="!newTagName.trim()" />
    </div>
  </div>

  @if (error()) {
  <p-message severity="error" [text]="error()!" class="mb" />
  }

  <div class="table-wrapper">
    @if (loading()) {
    <div class="loading">
      <p-progressSpinner />
    </div>
    }

    @if (!loading() && tags().length === 0) {
    <div class="empty-state">
      <i class="pi pi-tag"></i>
      <p>No tags yet. Create your first tag above.</p>
    </div>
    }

    @if (!loading() && tags().length > 0) {
    <div class="table-header">
      <span>Tag</span>
      <span>Color</span>
      <span></span>
    </div>

    @for (tag of tags(); track tag.id) {
    <div class="table-row">
      <div class="tag-name">
        <span class="tag-dot" [style.background]="tag.color"></span>
        <span>{{ tag.name }}</span>
      </div>
      <div class="tag-color-value">
        <span class="color-swatch" [style.background]="tag.color"></span>
        <span>{{ tag.color }}</span>
      </div>
      <div class="tag-actions">
        <button class="btn-delete" (click)="onDeleteTag(tag)">
          <i class="pi pi-trash"></i>
        </button>
      </div>
    </div>
    }
    }
  </div>

  <p-confirmdialog />
</div>
