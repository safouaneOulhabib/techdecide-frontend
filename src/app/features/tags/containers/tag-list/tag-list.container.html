<div class="tag-list">
  <div class="page-header">
    <h2>Tags</h2>
  </div>

  @if (loading()) {
    <div class="loading">
      <p-progressSpinner />
    </div>
  }

  @if (error()) {
    <p-message severity="error" [text]="error()!" />
  }

  <div class="create-form">
    <h3>Add New Tag</h3>
    <div class="form-row">
      <input
        pInputText
        [(ngModel)]="newTagName"
        placeholder="Tag name"
        (keyup.enter)="onCreateTag()"
      />
      <p-colorpicker [(ngModel)]="newTagColor" />
      <p-button
        label="Add Tag"
        icon="pi pi-plus"
        (onClick)="onCreateTag()"
        [disabled]="!newTagName.trim()"
      />
    </div>
  </div>

  @if (!loading() && tags().length === 0) {
    <div class="empty-state">
      <i class="pi pi-tag"></i>
      <p>No tags found. Create your first tag above.</p>
    </div>
  }

  <div class="tags-container">
    @for (tag of tags(); track tag.id) {
      <div class="tag-item">
        <p-tag [value]="tag.name" [style]="{ 'background-color': tag.color }" />
        <p-button
          icon="pi pi-times"
          severity="danger"
          [text]="true"
          [rounded]="true"
          size="small"
          (onClick)="onDeleteTag(tag)"
        />
      </div>
    }
  </div>

  <p-confirmdialog />
</div>
