<div class="organization-list">
  <div class="page-header">
    <h2>Organizations</h2>
    <p-button label="New Organization" icon="pi pi-plus" (onClick)="openDialog()" />
  </div>

  @if (error()) {
    <p-message severity="error" [text]="error()!" class="mb" />
  }

  <p-table
    [value]="organizations()"
    [loading]="loading()"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Created</th>
        <th style="width: 5rem"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-org>
      <tr>
        <td class="font-semibold">{{ org.name }}</td>
        <td class="text-secondary">{{ org.description }}</td>
        <td>{{ org.createdAt | date:'mediumDate' }}</td>
        <td>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="onDelete(org.id)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">
          <div class="empty-state">
            <i class="pi pi-building"></i>
            <p>No organizations found</p>
            <p-button label="Create your first organization" (onClick)="openDialog()" />
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    header="New Organization"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '450px' }"
  >
    <div class="dialog-form">
      <div class="field">
        <label for="orgName">Name *</label>
        <input id="orgName" pInputText [(ngModel)]="newName" placeholder="Organization name" />
      </div>
      <div class="field">
        <label for="orgDesc">Description</label>
        <textarea id="orgDesc" pTextarea [(ngModel)]="newDescription" rows="3" placeholder="Description (optional)"></textarea>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" severity="secondary" (onClick)="dialogVisible = false" />
      <p-button label="Create" icon="pi pi-check" (onClick)="onSubmit()" [disabled]="!newName.trim()" />
    </ng-template>
  </p-dialog>
</div>
