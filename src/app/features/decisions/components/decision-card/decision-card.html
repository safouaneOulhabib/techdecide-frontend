<div class="decision-card" (click)="onView.emit(decision().id)">
  <div class="card-header">
    <app-decision-status-badge [status]="decision().status" />
    <span class="card-team">{{ decision().teamName }}</span>
  </div>

  <div class="card-body">
    <h3 class="card-title">{{ decision().title }}</h3>
    <p class="card-context" [pTooltip]="decision().context" tooltipPosition="bottom" [showDelay]="400">
      {{ decision().context | slice:0:80 }}...
    </p>
  </div>

  @if (decision().tags.length > 0) {
  <div class="card-tags">
    @for (tag of decision().tags; track tag.id) {
    <span class="tag">{{ tag.name }}</span>
    }
  </div>
  }

  <div class="card-footer">
    <div class="card-meta">
      <span class="meta-item">
        <i class="pi pi-user"></i>
        {{ decision().authorName }}
      </span>
      <span class="meta-item">
        <i class="pi pi-calendar"></i>
        {{ decision().createdAt | date:'mediumDate' }}
      </span>
    </div>

    <button class="btn-delete" (click)="$event.stopPropagation(); onDelete.emit(decision().id)">
      <i class="pi pi-trash"></i>
    </button>
  </div>
</div>
