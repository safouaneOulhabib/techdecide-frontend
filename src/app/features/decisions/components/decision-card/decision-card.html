<p-card class="decision-card">
  <ng-template pTemplate="header">
    <div class="card-header">
      <app-decision-status-badge [status]="decision().status" />
      <span class="card-team">{{ decision().teamName }}</span>
    </div>
  </ng-template>

  <div class="card-body">
    <h3 class="card-title">{{ decision().title }}</h3>
    <p class="card-context">{{ decision().context | slice:0:120 }}...</p>

    <div class="card-meta">
      <span class="meta-author">
        <i class="pi pi-user"></i>
        {{ decision().authorName }}
      </span>
      <span class="meta-date">
        <i class="pi pi-calendar"></i>
        {{ decision().createdAt | date:'mediumDate' }}
      </span>
    </div>

    @if (decision().tags.length > 0) {
      <div class="card-tags">
        @for (tag of decision().tags; track tag) {
          <p-tag [value]="tag" severity="secondary" />
        }
      </div>
    }
  </div>

  <ng-template pTemplate="footer">
    <div class="card-actions">
      <p-button
        label="View"
        icon="pi pi-eye"
        size="small"
        (onClick)="onView.emit(decision().id)"
      />
      <p-button
        icon="pi pi-trash"
        severity="danger"
        size="small"
        [text]="true"
        (onClick)="onDelete.emit(decision().id)"
      />
    </div>
  </ng-template>
</p-card>
