<div class="decision-list">
  <div class="page-header">
    <h2>Technical Decisions</h2>
    <p-button label="New Decision" icon="pi pi-plus" (onClick)="onCreateNew()" />
  </div>

  <app-decision-filters [teams]="teams()" [tags]="tags()" (filtersChange)="onFiltersChange($event)" />

  @if (loading()) {
  <div class="loading">
    <p-progressSpinner />
  </div>
  }

  @if (error()) {
  <p-message severity="error" [text]="error()!" />
  }

  @if (!loading() && filteredDecisions().length === 0) {
  <div class="empty-state">
    <i class="pi pi-inbox"></i>
    <p>No decisions found</p>
    <p-button label="Create your first decision" (onClick)="onCreateNew()" />
  </div>
  }

  <div class="decisions-grid">
    @for (decision of filteredDecisions(); track decision.id) {
    <app-decision-card [decision]="decision" (onView)="onView($event)" (onDelete)="onDelete($event)" />
    }
  </div>
</div>
