<div class="team-list">
  <div class="page-header">
    <h2>Teams</h2>
    <p-button label="New Team" icon="pi pi-plus" (onClick)="openDialog()" />
  </div>

  @if (error()) {
  <p-message severity="error" [text]="error()!" class="mb" />
  }

  @if (loading()) {
  <div class="table-wrapper">
    <table class="skeleton-table">
      <thead>
        <tr>
          <th style="width: 30%">Name</th>
          <th style="width: 40%">Organization</th>
          <th style="width: 25%">Created</th>
          <th style="width: 5%"></th>
        </tr>
      </thead>
      <tbody>
        @for (item of [1,2,3,4,5]; track item) {
        <tr>
          <td>
            <div class="skeleton-name">
              <p-skeleton width="34px" height="34px" borderRadius="8px" />
              <p-skeleton width="140px" height="16px" />
            </div>
          </td>
          <td><p-skeleton width="160px" height="16px" /></td>
          <td><p-skeleton width="100px" height="16px" /></td>
          <td><p-skeleton width="28px" height="28px" borderRadius="6px" /></td>
        </tr>
        }
      </tbody>
    </table>
  </div>
  }
  @if (!loading()) {
  <div class="table-wrapper">
    <p-table [value]="teams()" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 30%">Name</th>
          <th style="width: 40%">Organization</th>
          <th style="width: 25%">Created</th>
          <th style="width: 5%"></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-team>
        <tr>
          <td>
            <div class="team-name">
              <div class="team-avatar">
                <i class="pi pi-users"></i>
              </div>
              <span>{{ team.name }}</span>
            </div>
          </td>
          <td>
            <span class="org-badge">
              <i class="pi pi-building"></i>
              {{ team.organizationName }}
            </span>
          </td>
          <td class="text-secondary">{{ team.createdAt | date:'mediumDate' }}</td>
          <td>
            <div class="row-actions">
              <button class="btn-members" (click)="onViewMembers(team.id)" pTooltip="View Members" tooltipPosition="top">
                <i class="pi pi-users"></i>
              </button>
              <button class="btn-delete" (click)="onDelete(team.id)">
                <i class="pi pi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-users"></i>
              <p>No teams found</p>
              <p-button label="Create your first team" (onClick)="openDialog()" />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  }
  <p-dialog header="New Team" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '450px' }">
    <div class="dialog-form">
      <div class="field">
        <label for="teamName">Name *</label>
        <input id="teamName" pInputText [(ngModel)]="newTeamName" placeholder="Team name" />
      </div>
      <div class="field">
        <label for="teamOrg">Organization *</label>
        <p-select id="teamOrg" [(ngModel)]="selectedOrgId" [options]="organizations()" optionLabel="name"
          optionValue="id" placeholder="Select organization" />
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" severity="secondary" (onClick)="dialogVisible = false" />
      <p-button label="Create" icon="pi pi-check" (onClick)="onSubmit()"
        [disabled]="!newTeamName.trim() || selectedOrgId === null" />
    </ng-template>
  </p-dialog>
</div>
