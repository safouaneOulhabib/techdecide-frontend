<div class="team-list">
  <div class="page-header">
    <h2>Teams</h2>
    <p-button label="New Team" icon="pi pi-plus" (onClick)="openDialog()" />
  </div>

  @if (error()) {
    <p-message severity="error" [text]="error()!" class="mb" />
  }

  <p-table
    [value]="teams()"
    [loading]="loading()"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Organization</th>
        <th>Created</th>
        <th style="width: 5rem"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-team>
      <tr>
        <td class="font-semibold">{{ team.name }}</td>
        <td>
          <span class="org-badge">
            <i class="pi pi-building"></i> {{ team.organizationName }}
          </span>
        </td>
        <td>{{ team.createdAt | date:'mediumDate' }}</td>
        <td>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="onDelete(team.id)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">
          <div class="empty-state">
            <i class="pi pi-users"></i>
            <p>No teams found</p>
            <p-button label="Create your first team" (onClick)="openDialog()" />
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    header="New Team"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '450px' }"
  >
    <div class="dialog-form">
      <div class="field">
        <label for="teamName">Name *</label>
        <input id="teamName" pInputText [(ngModel)]="newTeamName" placeholder="Team name" />
      </div>
      <div class="field">
        <label for="teamOrg">Organization *</label>
        <p-select
          id="teamOrg"
          [(ngModel)]="selectedOrgId"
          [options]="organizations()"
          optionLabel="name"
          optionValue="id"
          placeholder="Select organization"
        />
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" severity="secondary" (onClick)="dialogVisible = false" />
      <p-button
        label="Create"
        icon="pi pi-check"
        (onClick)="onSubmit()"
        [disabled]="!newTeamName.trim() || selectedOrgId === null"
      />
    </ng-template>
  </p-dialog>
</div>
