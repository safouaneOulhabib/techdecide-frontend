<div class="member-list">
  @if (loading() && !members().length) {
  <table class="members-table">
    <thead>
      <tr>
        <th style="width:40%">Member</th>
        <th style="width:20%">Role</th>
        <th style="width:25%">Joined</th>
        <th style="width:15%"></th>
      </tr>
    </thead>
    <tbody>
      @for (s of [1,2,3]; track s) {
      <tr>
        <td><p-skeleton width="120px" height="16px" /></td>
        <td><p-skeleton width="180px" height="16px" /></td>
        <td><p-skeleton width="80px" height="24px" borderRadius="12px" /></td>
        <td></td>
      </tr>
      }
    </tbody>
  </table>
  } @else if (members().length === 0) {
  <p class="empty-state">No members in this team yet.</p>
  } @else {
  <table class="members-table">
    <thead>
      <tr>
        <th style="width:40%">Member</th>
        <th style="width:20%">Role</th>
        <th style="width:25%">Joined</th>
        <th style="width:15%"></th>
      </tr>
    </thead>
    <tbody>
      @for (member of members(); track member.userId) {
      <tr app-team-member-row [member]="member" [currentUserId]="currentUserId()" [isAdmin]="isAdmin()"
        [isAdminOrTechLead]="isAdminOrTechLead()" (onRemove)="onRemove.emit($event)"
        (onRoleChange)="onRoleChange.emit($event)">
      </tr>
      }
    </tbody>
  </table>
  }
</div>
