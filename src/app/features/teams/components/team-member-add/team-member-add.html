<div class="member-add">
  <h3 class="add-title">Add Member</h3>
  <div class="add-form">
    <p-inputNumber [(ngModel)]="userId" [ngModelOptions]="{standalone: true}"
      placeholder="User ID" [useGrouping]="false" [min]="1" class="add-input" />
    <p-button label="Assign" icon="pi pi-user-plus"
      [disabled]="!userId() || loading()"
      [loading]="loading()"
      (onClick)="submit()" />
  </div>
</div>
